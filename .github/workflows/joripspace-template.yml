name: JoripSpace template branch

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: joripspace-template-branch
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build template history
        shell: bash
        run: |
          set -euo pipefail
          split_sha="$(git subtree split --prefix=template HEAD)"
          git push origin "${split_sha}:refs/heads/joripspace-template"
